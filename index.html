<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Notes</h1>
      <p id="note-count" data-testid="note-count"></p>
      <form id="note-form" novalidate>
        <input id="note-input" name="note" type="text" aria-label="New note" aria-describedby="note-error" autocomplete="off" />
        <button type="submit">Add</button>
        <p id="note-error" role="alert" data-testid="note-error" hidden></p>
      </form>
      <ul id="note-list" aria-label="Notes"></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
